<main>
    <h1>Add photo</h1>
    <div class="form-container">
        <p>Adding to gallery 1</p>
        <form action="/gallery" enctype="multipart/form-data" method="POST">
            <input name="action" type="hidden" value="photo_add_submit"><input name="id" type="hidden" value=""><input
                name="csrftoken" type="hidden" value="eVIQ3HKm0dyNXHIVXqo4AAhXpuC7DiZyeDlgWhvO">
            <input name="gallery" type="hidden" value="1">
            <div class="form-input-pair">
                <div>
                    Title:
                </div>
                <div>
                    <input name="title" type="text" value="">
                </div>
            </div>
            <div class="form-input-pair">
                <div>
                    Description:
                </div>
                <div>
                    <textarea name=caption></textarea>
                </div>
            </div>
            <div class="form-input-pair">
                <div>
                    Uploaded by:
                </div>
                <div>
                    <input name="uploader" type="text" value="Julian">
                </div>
            </div>
            <div class="form-input-pair">
                <div>
                    Image file:
                </div>
                <div>
                    <input name="photofile" type="file">
                </div>
            </div>
            <input class="submit-button" type="submit" value="Add photo">
        </form>
        <form action="/gallery" method="GET">
            <input class="submit-button" type="submit" value="Cancel">
